# Contrato do simulador-v2 — a fonte da verdade.
#
# Daqui geram-se os tipos Go (oapi-codegen, package api) e os tipos TypeScript
# da app (openapi-typescript). Ver docs/API.md para o porquê de cada decisão;
# este ficheiro manda nos detalhes. Correr `make gerar` depois de qualquer
# alteração — o portão reprova se o gerado ficar para trás.
#
# ⚠️ **Uma fronteira só**, desde a Fase 6 passo 5 (2026-08-07): `/api/v1/*`,
# nossa, versionada, em português e sem autenticação — é uma app sem contas a
# falar com ela, e quem a protege é o tecto por IP. Eram duas: a `/api/rate-catalog`
# saiu com o varrimento, que era quem lhe dava dados.
#
# O que atravessa a fronteira para o repositório da app é ESTE ficheiro, não o
# api/tipos-app.d.ts. A app corre o openapi-typescript dela sobre este yaml e
# põe do lado dela o mesmo portão que o `gerado` faz aqui. Não se publica pacote
# npm, e a decisão tem fundamento e não é preguiça:
#
#   - a regra do TypeScript («bundle os tipos se são gerados a partir da tua
#     fonte») decide onde os tipos viajam relativamente a um pacote. Aqui não há
#     pacote nenhum: o simulador-v2 serve JSON e não publica runtime JavaScript;
#   - publicar em npm justifica-se com consumidores públicos e desconhecidos a
#     quem é preciso prometer semver — o @octokit/openapi-types é esse caso.
#     Aqui há um consumidor, conhecido;
#   - um pacote publicado seria uma segunda cópia do contrato, versionada à
#     parte e capaz de ficar para trás. O portão `gerado` não alcança o que está
#     fora do repositório, e é essa divergência em silêncio que ele existe para
#     impedir.
#
# O api/tipos-app.d.ts fica como conveniência interna e prova de que o yaml
# gera; o package.json continua "private": true.
openapi: 3.0.3
info:
  title: simulador-v2
  version: 1.0.0
  description: >-
    Ofertas de crédito à habitação, perguntadas aos simuladores públicos dos
    bancos no momento em que alguém pergunta. Serve JSON e mais nada. A
    interface é uma app React Native noutro repositório.

    ⚠️ **Ao vivo, e é a segunda vez que o é.** Entre 2026-07-25 e 2026-08-06 os
    preços vinham de uma série varrida em hora morta, e nenhum pedido de um
    cliente chegava a um banco. A §1 do ARQUITETURA.md foi revertida — guardar
    uma cópia do modelo de preço de cada banco obriga a acertar em como eles
    preçam, e num só dia de confronto com dados reais isso falhou quatro vezes.
    Ver docs/DECISAO-AO-VIVO.md.

servers:
  - url: /
    description: O próprio serviço; os caminhos são absolutos a partir da raiz.

tags:
  - name: v1
    description: A API da app. Versionada, evolui por acrescento.
  - name: plataforma
    description: Sondagem de saúde para a plataforma de alojamento.

paths:
  /api/v1/bancos:
    get:
      operationId: listarBancos
      tags: [v1]
      summary: Tudo o que a app precisa para montar o formulário adaptativo.
      description: >-
        É a única fonte desta informação — a app não tem listas de bancos
        escritas à mão.
      parameters:
        - $ref: "#/components/parameters/VersaoDaApp"
      responses:
        "200":
          description: A lista de bancos e os inputs canónicos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BancosResposta"
        "426":
          $ref: "#/components/responses/VersaoDemasiadoAntiga"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/v1/ofertas/{banco}:
    post:
      operationId: ofertaDeUmBanco
      tags: [v1]
      summary: Pergunta a UM banco o preço do crédito descrito. Ao vivo.
      description: >-
        Vai ao simulador público do banco com os valores que a pessoa
        introduziu e devolve o que ele respondeu. Demora o que o banco demorar,
        com um prazo nosso por cima.


        ⚠️ É POST e não GET porque o pedido leva data de nascimento e
        rendimento: num GET isso viajava na query string, e ficava no histórico
        do browser, nos logs de qualquer proxy pelo caminho e no Referer.


        ⚠️ Um banco que não responde a tempo NÃO é um erro deste pedido: a
        resposta é 200 com a oferta em falha e o código `banco_indisponivel`.
        Quem falhou foi o banco, e a app põe uma linha com ele nomeado em vez de
        um ecrã de erro.
      parameters:
        - name: banco
          in: path
          required: true
          schema:
            type: string
          description: O id do banco, como vem em GET /api/v1/bancos.
        - $ref: "#/components/parameters/VersaoDaApp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfertaPedido"
      responses:
        "200":
          description: A oferta do banco, ou a recusa dele com o código nomeado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
        "400":
          $ref: "#/components/responses/PedidoInvalido"
        "404":
          description: O id não é banco nenhum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "426":
          $ref: "#/components/responses/VersaoDemasiadoAntiga"
        "429":
          $ref: "#/components/responses/TectoExcedido"
        "503":
          $ref: "#/components/responses/BancoOcupado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /healthz:
    get:
      operationId: saude
      tags: [plataforma]
      summary: Sondagem de saúde trivial para a plataforma.
      responses:
        "200":
          description: O serviço está de pé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saude"

components:
  # ⚠️ **Não há `securitySchemes`, e não é esquecimento.** Havia um `ApiKeyAuth`
  # — a credencial de máquina do `/api/rate-catalog` —, e saiu com a rota (Fase 6
  # passo 5). Este serviço não tem hoje credencial nenhuma: o `/api/v1` é público
  # de propósito, e quem o protege é o tecto por IP. Quem repuser uma fronteira de
  # máquina repõe isto E o grupo de rotas que a separa das do browser, porque uma
  # chave dentro de um bundle de browser é uma chave pública.

  parameters:
    VersaoDaApp:
      name: X-App-Versao
      in: header
      required: false
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        example: "1.2.0"
      description: >-
        A versão da app que está a pedir, em três números.

        ⚠️ **Opcional, e tem de continuar a ser.** O alvo web e quem
        experimenta a API por `curl` não a mandam, e exigi-la seria em si uma
        mudança que parte o `/api/v1` — que é o que este cabeçalho existe para
        evitar. Ausente, ou ilegível, serve-se na mesma: o que se recusa é uma
        versão conhecida e velha, nunca a falta de informação.

  responses:
    VersaoDemasiadoAntiga:
      description: >-
        A app que pediu é anterior à versão mínima que este servidor serve.
        Código `versao_demasiado_antiga`.

        ⚠️ **426 e não 400:** o pedido está bem formado e o problema é o
        cliente. Um 400 mandava a app corrigir o corpo, que é a acção errada.

        ⚠️ **Só acontece se o servidor tiver `APP_VERSAO_MINIMA` declarada**, e
        por omissão não tem. Existe desde 2026-08-08, antes de haver qualquer
        versão publicada, porque acrescentá-lo depois não serve de nada: as
        versões que precisavam de o entender já teriam saído sem ele.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    PedidoInvalido:
      description: Pedido inválido, com o campo nomeado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    TectoExcedido:
      description: >-
        Tecto de pedidos por IP excedido.

        ⚠️ **É estrutural, e não higiene.** Somos um amplificador: uma comparação
        a cinco bancos são cinco pedidos aqui e ~10 aos simuladores deles, com
        origem aparente nossa. Sem este tecto, isto é uma ferramenta de carga
        contra terceiros com uma app à frente.

        ⚠️ Dizia aqui que uma submissão «hoje custa uma consulta». Era verdade
        entre 2026-07-25 e 2026-08-06, e deixou de ser com a reversão da §1. O
        tecto fica nos 60/min: uma comparação são 5 pedidos, logo 12 comparações
        por minuto.
      headers:
        Retry-After:
          description: Segundos a esperar antes de repetir.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    ErroInterno:
      description: >-
        Rebentou uma coisa nossa e o pedido inteiro não se serviu. Código
        `erro_interno` — o mesmo que uma oferta em falha leva no `OfertaErro`,
        com alcance diferente (`docs/API.md` §1): ali falhou um banco e a lista
        continua a encher-se; aqui falhou o pedido. A `mensagem` não leva o
        interior do programa.

        ⚠️ Estava a ser emitido sem estar declarado — a lotação sem resposta, o
        Recoverer, um construtor de banco que devolve nada. A app já o tratava
        como «o serviço não está a responder»; o contrato passa a dizê-lo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    BancoOcupado:
      description: >-
        Já vão pedidos nossos a mais em curso contra este banco: o tecto de
        concorrência por banco está cheio (ARQUITETURA.md §7.2). Código
        `banco_ocupado`, e a resposta traz `Retry-After`.

        ⚠️ **Não confundir com a oferta em falha `banco_indisponivel`**, que vem
        com 200. Essa diz que o banco não respondeu; esta diz que quem não tem
        lugar somos nós, e o banco está bem. A distinção é para a app poder
        voltar a pedir este banco daqui a um instante em vez de o riscar da
        lista.
      headers:
        Retry-After:
          description: Segundos a esperar antes de voltar a pedir este banco.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"

  schemas:
    # --- /api/v1 — a app. Português, snake_case. ---

    BancosResposta:
      type: object
      required: [bancos, inputs_canonicos]
      properties:
        bancos:
          type: array
          items:
            $ref: "#/components/schemas/Banco"
        inputs_canonicos:
          type: array
          items:
            $ref: "#/components/schemas/InputCanonico"

    Banco:
      type: object
      required:
        [
          id,
          nome,
          inputs,
          periodos_fixos,
          periodos_fixos_modo,
          euribor_opcoes,
          euribor_imposto,
          prazo_min,
          prazo_max,
          idade_maxima_fim,
          produtos,
          notas,
        ]
      properties:
        id:
          type: string
          example: novobanco
        nome:
          type: string
          example: Novo Banco
        # ⚠️ Havia aqui um `custo: barato | caro`, e saiu com a inversão da §1.
        # Justificava-se com «dá à app uma expectativa honesta de tempo: com
        # bancos caros a comparação demora dezenas de segundos» — e uma
        # comparação já não interroga banco nenhum, portanto custa o mesmo em
        # todos: uma consulta. O campo continua a existir por dentro
        # (dominio.Custo, via Requisitos), onde é do varrimento que ele fala: é
        # dele que sai o prazo por pedido em varrimento.Prazos. O que saiu foi a
        # publicação dele à app, que passaria uma expectativa de tempo falsa.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/BancoInput"
        periodos_fixos:
          type: array
          items:
            type: integer
        periodos_fixos_modo:
          type: string
          enum: [lista, da-api, do-html]
        euribor_opcoes:
          type: array
          description: Vazio não é «não sei» — é «o banco impõe o seu e ignora a escolha».
          items:
            type: string
          example: ["3m", "6m", "12m"]
        euribor_imposto:
          type: string
          nullable: true
          description: Quando não-nulo, o banco impõe este indexante.
        prazo_min:
          type: integer
        prazo_max:
          type: integer
        idade_maxima_fim:
          type: integer
        produtos:
          type: array
          items:
            $ref: "#/components/schemas/Produto"
        notas:
          type: array
          items:
            type: string

    BancoInput:
      type: object
      required: [chave, usa]
      properties:
        chave:
          type: string
          example: valor_imovel
        usa:
          type: boolean
        nota:
          type: string
          description: Presente quando ajuda a explicar porque o banco não usa o campo.

    Produto:
      type: object
      required: [id, rotulo, descricao, por_omissao]
      properties:
        id:
          type: string
          example: novobanco:primeiro_banco
        rotulo:
          type: string
        descricao:
          type: string
        por_omissao:
          type: boolean

    InputCanonico:
      type: object
      required: [chave, rotulo, tipo]
      properties:
        chave:
          type: string
          example: valor_imovel
        rotulo:
          type: string
          example: Valor do imóvel
        tipo:
          type: string
          example: dinheiro

    OfertaPedido:
      type: object
      required: [pedido]
      description: >-
        O pedido para UM banco. Não leva lista de bancos: o banco vem no
        caminho, e os produtos são só os desse banco.
      properties:
        pedido:
          $ref: "#/components/schemas/Pedido"
        produtos:
          type: array
          description: Ids dos produtos escolhidos deste banco.
          items:
            type: string

    Pedido:
      type: object
      required:
        [
          valor_imovel,
          montante,
          prazo_anos,
          rate_type,
          titulares,
          finalidade,
          localizacao,
        ]
      properties:
        valor_imovel:
          type: number
          format: double
        montante:
          type: number
          format: double
        prazo_anos:
          type: integer
        rate_type:
          type: string
          enum: [variavel, fixa, mista]
        fixed_period_years:
          type: integer
          description: Anos de período fixo; aplica-se a `fixa` e `mista`.
        euribor_indexante:
          type: string
          enum: ["3m", "6m", "12m"]
        titulares:
          type: array
          items:
            $ref: "#/components/schemas/Titular"
        finalidade:
          type: string
          enum: [propria, secundaria, arrendamento]
        localizacao:
          type: string
          example: continente
        garantia_publica:
          type: boolean
        ja_cliente:
          type: boolean

    Titular:
      type: object
      required: [data_nascimento, rendimento_mensal]
      properties:
        data_nascimento:
          type: string
          format: date
          example: "1990-04-12"
        rendimento_mensal:
          type: number
          format: double

    # ⚠️ **Havia aqui uma `Comparacao`** — `{calculado_em, ofertas[]}`, o resultado
    # dos N bancos de uma vez —, e saiu com o `POST /api/v1/comparacoes` (Fase 6,
    # passo 5). Uma comparação deixou de ser uma resposta: é N respostas, uma por
    # banco, e o fan-out vive na app (ARQUITETURA.md §7.4, D2). O `calculado_em`
    # dela não tem sucessor e não faz falta — com cada oferta a vir do banco no
    # momento, o `capturado_em` de cada uma É a idade do preço, e um segundo
    # instante global só diria quando a última chegou.

    Oferta:
      type: object
      description: >-
        ⚠️ Quando `aplicado` não está vazio, os números não correspondem ao
        pedido — a app é obrigada a mostrar a nota junto do valor. `erro` só
        aparece quando `sucesso` é falso.
      required: [banco_id, banco_nome, sucesso]
      properties:
        banco_id:
          type: string
        banco_nome:
          type: string
        sucesso:
          type: boolean

        # --- Todos estes são o que o banco respondeu a ESTE pedido. ---
        #
        # ⚠️ **Eram duas famílias, «medidos» e «derivados», e passou a ser uma**
        # (2026-08-07). A separação existia porque a série de mercado era varrida
        # com um titular neutro sobre um cenário de referência: a TAN saía do
        # degrau de LTV observado e a TAEG tinha de ser reconstruída por um modelo
        # de encargos nosso. Ao vivo pergunta-se com os valores desta pessoa e o
        # simulador do banco devolve a TAEG e o MTIC dele — não há o que derivar.
        # Foi este modelo, e não os parsers, que a reversão da §1 matou.
        tan:
          type: number
          format: double
          description: A TAN que o banco devolveu para este pedido.
        spread:
          type: number
          format: double
          description: >-
            O spread que o banco aplicou a este pedido. ⚠️ Não é uma banda
            assumida nem um intervalo por resolver: é o número que ele devolveu,
            para o rácio de financiamento que esta pessoa pediu.
        prestacao_mensal:
          type: number
          format: double
          description: A prestação mensal que o banco devolveu para este pedido.
        taeg:
          type: number
          format: double
          description: >-
            A TAEG que o simulador do banco devolveu.

            ⚠️ **Cotada por ele, e não derivada por nós.** Dizia aqui «DERIVADA,
            não medida», e era verdade enquanto os preços vinham da série varrida.
            Deixou de ser a 2026-08-06.

            ⚠️ Continua a NÃO ser a TAEG que vincula alguém: essa vem na ficha de
            informação normalizada, depois de o banco avaliar quem pede. É a
            distinção que a app é obrigada a mostrar — mas é uma distinção entre
            simulação e proposta, não entre medido e estimado.
        mtic:
          type: number
          format: double
          description: O MTIC que o simulador do banco devolveu, pela mesma razão que a `taeg`.

        # ⚠️ **Havia aqui um `pressupostos`** — as hipóteses sob as quais a `taeg`
        # e o `mtic` tinham sido derivados, que a MCD (Anexo I, Parte II; Anexo II)
        # obriga a declarar junto de um número que delas depende. Sai porque o
        # número deixou de depender de hipóteses nossas: é o do banco. As hipóteses
        # que o BANCO declara continuam a chegar, e chegam onde sempre chegaram —
        # em `notas`, palavra por palavra (o Montepio, por exemplo, diz lá que
        # projecta a taxa do período fixo para o resto do prazo).

        euribor_indexante:
          type: string
        euribor_valor:
          type: number
          format: double
        fases:
          type: array
          items:
            $ref: "#/components/schemas/Fase"
        produtos_aplicados:
          type: array
          items:
            type: string
        aplicado:
          type: object
          description: O que o banco usou de facto, quando difere do pedido. Vazio = igual ao pedido.
          additionalProperties: true
        notas:
          type: array
          items:
            type: string
        # ⚠️ **Havia aqui um `fiabilidade`** — `por_confirmar | confirmada |
        # em_duvida` (KAN-49), o que a sonda tinha apurado sobre a grelha de onde
        # o preço saía. Sai com a sonda e com a grelha: ao vivo não há nada entre
        # a resposta do banco e o que se serve, portanto não há terceira coisa a
        # confirmar. ⚠️ **A regra que ele carregava não sai com ele**, e vale para
        # o que vier: um estado que só aparece quando as notícias são más ensina a
        # app a tratar a ausência como boa notícia.
        #
        # ⚠️ O `em_cache` VOLTA (2026-08-07), depois de ter saído com a inversão
        # da §1 e pela razão que essa inversão criou: com tudo a vir da série
        # varrida, o campo era sempre `true` e não informava. Ao vivo volta a
        # separar duas coisas que existem outra vez — uma resposta que acabou de
        # vir do banco, e uma que se serviu de Postgres sem lhe perguntar.
        em_cache:
          type: boolean
          description: >-
            Verdadeiro quando esta oferta se serviu da cache (§7.6) em vez de se
            perguntar ao banco agora.

            ⚠️ **Não é o mesmo que `capturado_em`, e nenhum dos dois substitui o
            outro.** O `capturado_em` diz de QUANDO é o preço, e num acerto de
            cache é o instante em que se falou com o banco — nunca o de agora.
            Este diz se ESTE pedido chegou a sair para o banco. Uma oferta fresca
            e um acerto de um segundo atrás têm `capturado_em` quase igual e
            `em_cache` diferente.

            ⚠️ Ausente vale `false`, e não leva `default:` de propósito: o
            `openapi-typescript` traduz um campo com omissão para um campo
            OBRIGATÓRIO no tipo gerado, e a app passaria a afirmar que a resposta
            traz sempre este campo — que é precisamente o que o `required` diz que
            não. A regra fica na descrição, onde não mente ao gerador.
        capturado_em:
          type: string
          format: date-time
          description: >-
            Quando se falou com o banco — o instante em que este preço foi
            cotado.

            ⚠️ **Não é «agora», e a diferença é a razão de o campo existir.** Num
            acerto de cache (§7.6) é o instante da ida ao banco que produziu a
            resposta guardada, e pode ser de há cinco minutos. Numa oferta fresca
            é de há segundos. Dizia aqui «durante o varrimento», e o varrimento
            saiu — o que fica é o mesmo compromisso por outro caminho.

            ⚠️ Presente sempre que `sucesso` é verdadeiro, e é o campo mais
            importante desta lista para a honestidade do produto. A app é
            obrigada a mostrá-lo, e o servidor **recusa servir** uma oferta com
            preço e sem ele (`traduzir.go`): um preço sem data apresenta-se como
            se fosse de agora.
        erro:
          $ref: "#/components/schemas/OfertaErro"

    Fase:
      type: object
      required: [ate_mes, taxa, prestacao]
      properties:
        ate_mes:
          type: integer
        taxa:
          type: number
          format: double
        prestacao:
          type: number
          format: double

    OfertaErro:
      type: object
      description: >-
        Estruturado de propósito: `codigo` é para a app decidir, `mensagem` é
        para a pessoa ler, em português.
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          example: prazo_impossivel
        mensagem:
          type: string

    # --- Transversal ---

    RespostaErro:
      type: object
      required: [erro]
      properties:
        erro:
          $ref: "#/components/schemas/DetalheErro"
        request_id:
          type: string

    DetalheErro:
      type: object
      required: [codigo, mensagem]
      properties:
