# Contrato do simulador-v2 — a fonte da verdade.
#
# Daqui geram-se os tipos Go (oapi-codegen, package api) e os tipos TypeScript
# da app (openapi-typescript). Ver docs/API.md para o porquê de cada decisão;
# este ficheiro manda nos detalhes. Correr `make gerar` depois de qualquer
# alteração — o portão reprova se o gerado ficar para trás.
#
# Duas fronteiras com estatutos diferentes:
#   /api/v1/*        nossa, versionada, evolui com a app. Nomes em português.
#   /api/rate-catalog  ⚠️ CONGELADA. Inglês e snake_case, ao contrário de todo o
#                    resto — o viabilidade-imobiliaria lê-a em produção e mudá-la
#                    parte-o sem aviso. Não "arrumar" os nomes.
#
# O que atravessa a fronteira para o repositório da app é ESTE ficheiro, não o
# api/tipos-app.d.ts. A app corre o openapi-typescript dela sobre este yaml e
# põe do lado dela o mesmo portão que o `gerado` faz aqui. Não se publica pacote
# npm, e a decisão tem fundamento e não é preguiça:
#
#   - a regra do TypeScript («bundle os tipos se são gerados a partir da tua
#     fonte») decide onde os tipos viajam relativamente a um pacote. Aqui não há
#     pacote nenhum: o simulador-v2 serve JSON e não publica runtime JavaScript;
#   - publicar em npm justifica-se com consumidores públicos e desconhecidos a
#     quem é preciso prometer semver — o @octokit/openapi-types é esse caso.
#     Aqui há um consumidor, conhecido;
#   - um pacote publicado seria uma segunda cópia do contrato, versionada à
#     parte e capaz de ficar para trás. O portão `gerado` não alcança o que está
#     fora do repositório, e é essa divergência em silêncio que ele existe para
#     impedir.
#
# O api/tipos-app.d.ts fica como conveniência interna e prova de que o yaml
# gera; o package.json continua "private": true.
openapi: 3.0.3
info:
  title: simulador-v2
  version: 1.0.0
  description: >-
    Comparação de ofertas de crédito à habitação, e a série temporal de mercado
    de onde ela sai. Serve JSON e mais nada. A interface é uma app React Native
    noutro repositório.

    ⚠️ Dizia aqui «ao vivo», e era verdade até 2026-07-25. A §1 do
    ARQUITETURA.md inverteu-se nesse dia: os simuladores públicos dos bancos
    correm-se em hora morta, por `simulador varrer`, e uma comparação
    responde-se por consulta a essa série e cálculo local. Nenhum pedido de um
    cliente chega a um banco.

servers:
  - url: /
    description: O próprio serviço; os caminhos são absolutos a partir da raiz.

tags:
  - name: v1
    description: A API da app. Versionada, evolui por acrescento.
  - name: rate-catalog
    description: ⚠️ Congelada e compatível ao byte com o v1. Inglês, snake_case.
  - name: plataforma
    description: Sondagem de saúde para a plataforma de alojamento.

paths:
  /api/v1/bancos:
    get:
      operationId: listarBancos
      tags: [v1]
      summary: Tudo o que a app precisa para montar o formulário adaptativo.
      description: >-
        É a única fonte desta informação — a app não tem listas de bancos
        escritas à mão.
      responses:
        "200":
          description: A lista de bancos e os inputs canónicos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BancosResposta"

  /api/v1/comparacoes:
    post:
      operationId: compararOfertas
      tags: [v1]
      summary: Compara as ofertas dos bancos escolhidos. Síncrono.
      description: >-
        ⚠️ Responde de uma vez, com estatuto 200. Não há trabalho em segundo
        plano, identificador para sondar, nem estado `em_curso` — e a diferença
        não é de estilo. Desde a inversão da §1 do ARQUITETURA.md (2026-07-25)
        uma comparação NÃO fala com banco nenhum: lê a série varrida em hora
        morta e calcula localmente. Custa uma consulta e aritmética, e não as
        dezenas de segundos de scraping que justificavam o 202 e a sondagem.

        ⚠️ Nada do pedido é persistido (§7.5, e a postura pública do README):
        não há recurso a que voltar, e é por isso que não existe
        `GET /api/v1/comparacoes/{id}`. Poder sondar uma resposta obrigaria a
        guardar o pedido que a gerou — que é precisamente o dado pessoal que
        este serviço se recusa a ter. A ausência da rota é a decisão, não uma
        lacuna.

        ⚠️ A `taeg` e o `mtic` de cada oferta são DERIVADOS, não medidos, e cada
        oferta declara em `pressupostos` sobre que hipóteses. Ver o schema da
        Oferta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparacaoPedido"
      responses:
        "200":
          description: As ofertas calculadas a partir da série de mercado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparacao"
        "400":
          $ref: "#/components/responses/PedidoInvalido"
        "429":
          $ref: "#/components/responses/TectoExcedido"
        "503":
          $ref: "#/components/responses/SerieIndisponivel"

  /api/rate-catalog:
    get:
      operationId: obterRateCatalog
      tags: [rate-catalog]
      summary: ⚠️ CONGELADA — a série de mercado, compatível ao byte com o v1.
      description: >-
        Consumida em produção pelo viabilidade-imobiliaria
        (src/viabilidade/taxas.py). Nomes em inglês e snake_case, ao contrário
        do resto do repositório. Três armadilhas de compatibilidade, todas
        cobertas pelo teste de contrato contra uma amostra real do v1:
        (1) números, não strings — a serialização de decimais em Go põe aspas
        por omissão, e aqui a saída é `number`;
        (2) `captured_at` sem fuso — o v1 serializava instantes ingénuos
        (`2026-07-22T05:00:11`, sem Z); este endpoint replica o formato antigo,
        por isso é `string` e não `date-time`;
        (3) `products` é sempre lista, nunca null.
        Sem `X-API-Key` configurada o endpoint fica aberto — comportamento de
        desenvolvimento, com aviso alto no arranque.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: scenario
          in: query
          required: false
          schema:
            type: string
        - name: bank
          in: query
          required: false
          schema:
            type: string
        - name: rate_type
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Instante ISO 8601; devolve pontos capturados a partir daqui.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Cenários de referência e os pontos de mercado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCatalog"

  /api/rate-catalog/snapshots:
    get:
      operationId: listarSnapshots
      tags: [rate-catalog]
      summary: ⚠️ CONGELADA — os varrimentos disponíveis, com contagem de linhas.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: A lista de snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotsResposta"

  /healthz:
    get:
      operationId: saude
      tags: [plataforma]
      summary: Sondagem de saúde trivial para a plataforma.
      responses:
        "200":
          description: O serviço está de pé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saude"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    PedidoInvalido:
      description: Pedido inválido, com o campo nomeado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    TectoExcedido:
      description: >-
        Tecto de pedidos por IP excedido.

        ⚠️ A razão mudou com a inversão da §1, e o tecto não. Existia porque cada
        submissão custava dezenas de segundos de scraping a partir do NOSSO IP
        contra os bancos — hoje custa uma consulta, e essa justificação caiu.
        Fica por outra, ordinária e suficiente: isto é JSON público e um tecto é
        o que impede um cliente avariado de esgotar o pool de ligações dos
        outros. É o mesmo endpoint e um limiar muito mais alto; o que não se faz
        é apagar o tecto por a primeira razão ter deixado de valer.
      headers:
        Retry-After:
          description: Segundos a esperar antes de repetir.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
    SerieIndisponivel:
      description: >-
        Não há série de mercado que responda a este pedido: nenhum dos bancos
        escolhidos tem observações utilizáveis.

        ⚠️ Substitui o `DemasiadasEmCurso` do modelo ao vivo, e não é o mesmo
        503. Aquele dizia «estamos ocupados a falar com os bancos, volta»; este
        diz «o varrimento ainda não correu, ou correu e falhou para estes
        bancos». O primeiro resolvia-se esperando; este resolve-se correndo
        `simulador varrer` — e é por isso que a mensagem tem de os distinguir em
        vez de os empacotar num «tenta mais tarde».
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"

  schemas:
    # --- /api/v1 — a app. Português, snake_case. ---

    BancosResposta:
      type: object
      required: [bancos, inputs_canonicos]
      properties:
        bancos:
          type: array
          items:
            $ref: "#/components/schemas/Banco"
        inputs_canonicos:
          type: array
          items:
            $ref: "#/components/schemas/InputCanonico"

    Banco:
      type: object
      required:
        [
          id,
          nome,
          inputs,
          periodos_fixos,
          periodos_fixos_modo,
          euribor_opcoes,
          euribor_imposto,
          prazo_min,
          prazo_max,
          idade_maxima_fim,
          produtos,
          notas,
        ]
      properties:
        id:
          type: string
          example: novobanco
        nome:
          type: string
          example: Novo Banco
        # ⚠️ Havia aqui um `custo: barato | caro`, e saiu com a inversão da §1.
        # Justificava-se com «dá à app uma expectativa honesta de tempo: com
        # bancos caros a comparação demora dezenas de segundos» — e uma
        # comparação já não interroga banco nenhum, portanto custa o mesmo em
        # todos: uma consulta. O campo continua a existir por dentro
        # (dominio.Custo, via Requisitos), onde é do varrimento que ele fala: é
        # dele que sai o prazo por pedido em varrimento.Prazos. O que saiu foi a
        # publicação dele à app, que passaria uma expectativa de tempo falsa.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/BancoInput"
        periodos_fixos:
          type: array
          items:
            type: integer
        periodos_fixos_modo:
          type: string
          enum: [lista, da-api, do-html]
        euribor_opcoes:
          type: array
          description: Vazio não é «não sei» — é «o banco impõe o seu e ignora a escolha».
          items:
            type: string
          example: ["3m", "6m", "12m"]
        euribor_imposto:
          type: string
          nullable: true
          description: Quando não-nulo, o banco impõe este indexante.
        prazo_min:
          type: integer
        prazo_max:
          type: integer
        idade_maxima_fim:
          type: integer
        produtos:
          type: array
          items:
            $ref: "#/components/schemas/Produto"
        notas:
          type: array
          items:
            type: string

    BancoInput:
      type: object
      required: [chave, usa]
      properties:
        chave:
          type: string
          example: valor_imovel
        usa:
          type: boolean
        nota:
          type: string
          description: Presente quando ajuda a explicar porque o banco não usa o campo.

    Produto:
      type: object
      required: [id, rotulo, descricao, por_omissao]
      properties:
        id:
          type: string
          example: novobanco:primeiro_banco
        rotulo:
          type: string
        descricao:
          type: string
        por_omissao:
          type: boolean

    InputCanonico:
      type: object
      required: [chave, rotulo, tipo]
      properties:
        chave:
          type: string
          example: valor_imovel
        rotulo:
          type: string
          example: Valor do imóvel
        tipo:
          type: string
          example: dinheiro

    ComparacaoPedido:
      type: object
      required: [bancos, pedido]
      properties:
        bancos:
          type: array
          items:
            type: string
          example: ["cgd", "novobanco", "montepio", "bancoctt"]
        pedido:
          $ref: "#/components/schemas/Pedido"
        produtos:
          type: object
          description: Produtos escolhidos por banco. Chave = id do banco.
          additionalProperties:
            type: array
            items:
              type: string

    Pedido:
      type: object
      required:
        [
          valor_imovel,
          montante,
          prazo_anos,
          rate_type,
          titulares,
          finalidade,
          localizacao,
        ]
      properties:
        valor_imovel:
          type: number
          format: double
        montante:
          type: number
          format: double
        prazo_anos:
          type: integer
        rate_type:
          type: string
          enum: [variavel, fixa, mista]
        fixed_period_years:
          type: integer
          description: Anos de período fixo; aplica-se a `fixa` e `mista`.
        euribor_indexante:
          type: string
          enum: ["3m", "6m", "12m"]
        titulares:
          type: array
          items:
            $ref: "#/components/schemas/Titular"
        finalidade:
          type: string
          enum: [propria, secundaria, arrendamento]
        localizacao:
          type: string
          example: continente
        garantia_publica:
          type: boolean
        ja_cliente:
          type: boolean

    Titular:
      type: object
      required: [data_nascimento, rendimento_mensal]
      properties:
        data_nascimento:
          type: string
          format: date
          example: "1990-04-12"
        rendimento_mensal:
          type: number
          format: double

    Comparacao:
      type: object
      description: >-
        O resultado completo, de uma vez.

        ⚠️ Não tem `id`, `estado` nem `progresso`, e nenhum dos três falta por
        esquecimento — a resposta É o cálculo inteiro, e não o primeiro estado de
        um trabalho que continua. Estavam aqui um `SimulacaoCriada`
        (`{id, estado, bancos, duracao_estimada_s}`) e um `Simulacao` com
        `estado: em_curso | terminado` e `progresso: {prontos, total}`: existiam
        para a app desenhar uma barra enquanto se falava com os bancos. Já não se
        fala com os bancos no caminho do cliente, e uma barra de progresso sobre
        uma consulta a Postgres seria teatro.

        ⚠️ Também não tem `pedido_efectivo`. Aquele campo trazia
        `{montante, valor_imovel, quantizado}` porque a cache quantizava o
        montante para partilhar entradas entre pedidos parecidos, e a app tinha
        de mostrar o valor efectivamente simulado em vez do pedido. Sem cache não
        há quantização: o cálculo usa o montante que foi pedido, ao cêntimo. O
        que um banco ajusta (prazo, período fixo, indexante) continua a viajar em
        `Oferta.aplicado`, com a nota obrigatória agarrada — por banco, que é
        onde o ajuste acontece, e não num campo global que fingia valer para
        todos.
      required: [calculado_em, ofertas]
      properties:
        calculado_em:
          type: string
          format: date-time
          description: >-
            Quando ESTA resposta foi calculada.

            ⚠️ Não é o `capturado_em` de cada oferta, que é quando o preço foi
            medido no banco. Os dois são diferentes por construção, e é
            precisamente essa diferença que diz à pessoa a idade do preço que
            está a ver — por isso viajam os dois, e por isso nenhum deles é
            opcional numa oferta com sucesso.
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/Oferta"

    Oferta:
      type: object
      description: >-
        ⚠️ Quando `aplicado` não está vazio, os números não correspondem ao
        pedido — a app é obrigada a mostrar a nota junto do valor. `erro` só
        aparece quando `sucesso` é falso.
      required: [banco_id, banco_nome, sucesso]
      properties:
        banco_id:
          type: string
        banco_nome:
          type: string
        sucesso:
          type: boolean

        # --- Medidos, ou aritmética exacta sobre medições ---
        tan:
          type: number
          format: double
          description: >-
            Spread do degrau de LTV que contém o rácio pedido, mais a Euribor do
            tenor aplicável — ambos medidos. Na fixa e na mista, a taxa da fase
            fixa é a observação do período que o banco pratica.
        spread:
          type: number
          format: double
          description: >-
            ⚠️ Do INTERVALO de LTV medido que contém o rácio pedido, e não de uma
            banda assumida. Num degrau que não se conseguiu resolver é o lado
            mais CARO do intervalo (Directiva 2014/17/UE, Anexo I, Parte II,
            alínea (d)), e `notas` traz a frase que nomeia os dois lados.
        prestacao_mensal:
          type: number
          format: double
          description: >-
            Amortização francesa sobre a `tan` e o montante pedido. É aritmética
            exacta, não medição — e é por isso que responde ao montante desta
            pessoa, e não ao do cenário de referência.

        # --- Derivados: dependem de hipóteses, e declaram-nas ---
        taeg:
          type: number
          format: double
          description: >-
            ⚠️ DERIVADA, não medida. Ver `pressupostos`, que é obrigatório sempre
            que este campo vem preenchido.

            A TAEG depende dos encargos (comissões, imposto, seguros) e o seguro
            de vida depende de quem pede — e a série de mercado é varrida com um
            titular NEUTRO e fictício, sobre um cenário de referência fixo (§4).
            Não existe, portanto, TAEG medida para esta pessoa. O que se faz é
            atribuir a encargos a diferença entre a TAEG e a TAN observadas no
            ponto de referência, e reamortizar sobre os fluxos deste pedido.

            ⚠️ A repartição desses encargos entre comissões, imposto e seguro NÃO
            está medida: é inferida. Quem lê este número tem de o tratar como
            indicativo, e a app é obrigada a mostrar `pressupostos` junto dele —
            é o que o Anexo I e o Anexo II da MCD mandam fazer a um valor que
            depende de hipóteses declaradas.
        mtic:
          type: number
          format: double
          description: >-
            ⚠️ DERIVADO, pela mesma razão e sobre o mesmo modelo de encargos que
            a `taeg`. Ver `pressupostos`.
        pressupostos:
          type: array
          description: >-
            As hipóteses sob as quais a `taeg` e o `mtic` desta oferta foram
            derivados, em português e legíveis por uma pessoa.

            ⚠️ Lista à parte de `notas`, e não misturada nela, de propósito: as
            duas têm estatutos diferentes. Uma `nota` é um aviso sobre o que
            aconteceu a ESTE pedido — o banco encurtou o prazo, o degrau de LTV
            não estava resolvido. Um pressuposto é uma hipótese de cálculo que a
            MCD obriga a declarar junto do número que dela depende (Anexo I,
            Parte II; Anexo II). Empacotadas na mesma lista, a app ficava sem
            forma de as apresentar como o que são.

            ⚠️ Não vazia sempre que `taeg` ou `mtic` vêm preenchidos. Vazia com um
            deles preenchido é defeito nosso, e não um caso legítimo.
          items:
            type: string

        euribor_indexante:
          type: string
        euribor_valor:
          type: number
          format: double
        fases:
          type: array
          items:
            $ref: "#/components/schemas/Fase"
        produtos_aplicados:
          type: array
          items:
            type: string
        aplicado:
          type: object
          description: O que o banco usou de facto, quando difere do pedido. Vazio = igual ao pedido.
          additionalProperties: true
        notas:
          type: array
          items:
            type: string
        # ⚠️ Havia aqui um `em_cache: boolean`, e saiu com a inversão da §1. Dizia
        # à app se a oferta veio da cache ou de uma chamada fresca ao banco — uma
        # distinção que deixou de existir: TODAS as ofertas vêm da série varrida,
        # e nenhuma vem de uma chamada no caminho do cliente. Um campo que é
        # sempre `true` não informa, e um campo chamado `em_cache` quando não há
        # cache nenhuma informa mal. O que a app precisa de saber sobre a idade
        # do preço está no `capturado_em` abaixo, que é um instante e não um
        # booleano.
        capturado_em:
          type: string
          format: date-time
          description: >-
            Quando o preço foi MEDIDO no banco, durante o varrimento — não quando
            esta resposta foi calculada (isso é o `calculado_em` da Comparacao).

            ⚠️ Presente sempre que `sucesso` é verdadeiro, e é o campo mais
            importante desta lista para a honestidade do produto: é o único que
            diz à pessoa que está a ver um preço de ontem à noite e não de agora.
            A app é obrigada a mostrá-lo. Escondê-lo apresentaria dados varridos
            como se fossem uma consulta ao vivo ao banco, que é exactamente o que
            este serviço não faz.
        erro:
          $ref: "#/components/schemas/OfertaErro"

    Fase:
      type: object
      required: [ate_mes, taxa, prestacao]
      properties:
        ate_mes:
          type: integer
        taxa:
          type: number
          format: double
        prestacao:
          type: number
          format: double

    OfertaErro:
      type: object
      description: >-
        Estruturado de propósito: `codigo` é para a app decidir, `mensagem` é
        para a pessoa ler, em português.
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          example: prazo_impossivel
        mensagem:
          type: string

    # --- Transversal ---

    RespostaErro:
      type: object
      required: [erro]
      properties:
        erro:
          $ref: "#/components/schemas/DetalheErro"
        request_id:
          type: string

    DetalheErro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          example: pedido_invalido
        mensagem:
          type: string
        campo:
          type: string
          description: O campo que falhou, quando aplicável.

    Saude:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          example: ok

    # --- /api/rate-catalog — ⚠️ CONGELADA. Inglês, snake_case. ---
    # Não traduzir estes nomes para português: o viabilidade-imobiliaria lê-os
    # em produção. Ver a descrição do path e docs/API.md §2.

    RateCatalog:
      type: object
      required: [scenarios, count, points]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/Scenario"
        count:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"

    Scenario:
      type: object
      required:
        [
          key,
          label,
          ltv,
          valor_imovel,
          montante,
          prazo_anos,
          rate_type,
          fixed_period_years,
        ]
      properties:
        key:
          type: string
          example: ltv80_mista_30a
        label:
          type: string
          example: "LTV 80% · mista · 30 anos"
        ltv:
          type: number
          format: double
        valor_imovel:
          type: number
          format: double
        montante:
          type: number
          format: double
        prazo_anos:
          type: integer
        rate_type:
          type: string
        fixed_period_years:
          type: integer
          nullable: true
          description: >-
            ⚠️ **Nulo na taxa variável**, e é assim que o v1 o envia — medido a
            2026-07-28 contra o v1 a correr. Um inteiro não-nulo em Go serializa
            `0`, e o `viabilidade-imobiliaria` receberia zero anos de período
            fixo onde espera «não se aplica».

    Point:
      type: object
      description: >-
        ⚠️ `captured_at` é `string` (sem fuso, formato v1) de propósito.
        `products` é sempre lista, nunca null. Os números são `number`, não
        string.
      required:
        [
          snapshot_id,
          captured_at,
          scenario_key,
          bank_id,
          bank_name,
          rate_type,
          valor_imovel,
          montante,
          prazo_anos,
          fixed_period_years,
          tan,
          taeg,
          spread,
          prestacao_mensal,
          mtic,
          euribor_indexante,
          euribor_valor,
          products,
        ]
      properties:
        snapshot_id:
          type: string
        captured_at:
          type: string
          description: "⚠️ Sem fuso, formato v1 (ex.: 2026-07-22T05:00:11). NÃO é date-time."
          example: "2026-07-22T05:00:11"
        scenario_key:
          type: string
        bank_id:
          type: string
        bank_name:
          type: string
        rate_type:
          type: string
        valor_imovel:
          type: number
          format: double
        montante:
          type: number
          format: double
        prazo_anos:
          type: integer
        fixed_period_years:
          type: integer
          nullable: true
          description: ⚠️ Nulo na taxa variável, como o v1 o envia. Ver o Scenario.
        tan:
          type: number
          format: double
        taeg:
          type: number
          format: double
        spread:
          type: number
          format: double
        prestacao_mensal:
          type: number
          format: double
        mtic:
          type: number
          format: double
        euribor_indexante:
          type: string
        euribor_valor:
          type: number
          format: double
        products:
          type: array
          items:
            type: string

    SnapshotsResposta:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/Snapshot"

    Snapshot:
      type: object
      required: [snapshot_id, captured_at, rows]
      properties:
        snapshot_id:
          type: string
        captured_at:
          type: string
          description: ⚠️ Sem fuso, formato v1.
        rows:
          type: integer
