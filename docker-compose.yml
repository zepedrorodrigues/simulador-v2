# Ambiente de desenvolvimento: PostgreSQL, e mais nada.
#
# ⚠️ O Redis esteve aqui e saiu (KAN-39), porque a §7 do ARQUITETURA.md o tinha
# tirado do desenho a 2026-07-25 e o ambiente ficou para trás. Estava cá para a
# cache e para o *gate* por banco, e nenhum dos dois existe: a leitura do cliente
# é uma consulta a `catalogo_taxas`, e o *gate* vive em `internal/infra/travao`,
# no `pg_try_advisory_lock` do próprio PostgreSQL. Se um dia voltar, volta por
# uma entrada nova na §7 — não por alguém achar que um contentor a mais não faz
# mal.
#
# A app não entra aqui — o `Dockerfile` é a KAN-22, fase 4. O `make dev` sobe
# este serviço e espera que responda de facto.
#
# Todas as variáveis têm default: `make dev` funciona numa máquina limpa, sem
# `.env` nenhum. O que se pode afinar está em `.env.example`.

name: simulador-v2

services:
  postgres:
    image: postgres:18.4-alpine

    # ⚠️ Portas fora das habituais, e fora das do v1. Nesta máquina a 5432 está
    # ocupada por um PostgreSQL nativo, e o `simulador-credito-habitacao`
    # publica a 55432 — os dois repositórios têm de poder estar de pé ao mesmo
    # tempo, que é precisamente a situação de quem compara o v2 com o v1.
    #
    # ⚠️ Só em 127.0.0.1, nunca 0.0.0.0: no dia em que isto corra num VPS, um
    # bind em todas as interfaces põe a base de dados na internet.
    ports:
      - "127.0.0.1:${PG_PORTA:-55433}:5432"

    environment:
      POSTGRES_USER: ${PG_UTILIZADOR:-simulador}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-simulador}
      POSTGRES_DB: ${PG_BASE:-simulador}

    # ⚠️ `/var/lib/postgresql` e **não** `/var/lib/postgresql/data`. Nas imagens
    # 18+ os dados passaram a viver numa subpasta com o nome da major, e a
    # imagem **recusa arrancar** se encontrar um mount no caminho antigo:
    #
    #   Error: in 18+, these Docker images are configured to store database data
    #          in a format which is compatible with "pg_ctlcluster" [...]
    #          there appears to be PostgreSQL data in:
    #            /var/lib/postgresql/data (unused mount/volume)
    #
    # O compose do v1 tem a linha antiga. Copiá-la para aqui não degrada — mata
    # o contentor à saída.
    volumes:
      - pgdata:/var/lib/postgresql

    # ⚠️ O `-h 127.0.0.1` não é enfeite. A entrada da imagem corre o `initdb` e
    # depois um servidor **temporário** com `listen_addresses=''` — só socket
    # unix — para aplicar a inicialização. Esse servidor responde a um
    # `pg_isready` sem `-h`, e a seguir é desligado. Medido, sonda de 100 ms por
    # dentro do contentor com volume limpo:
    #
    #   socket=nao tcp=nao   (×11)
    #   socket=SIM tcp=nao   ← o servidor do initdb: pronto por socket
    #   socket=nao tcp=nao   ← e já desligado
    #   socket=SIM tcp=SIM   ← só aqui é o servidor a sério
    #
    # Sem o `-h`, o healthcheck fica verde na 12.ª amostra, o `--wait` devolve, e
    # o que vier a seguir liga-se a um servidor que está prestes a desaparecer.
    # Falha intermitente, que é a pior espécie. Forçar TCP exclui o servidor de
    # inicialização por construção: esse não escuta em TCP nenhum.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U ${PG_UTILIZADOR:-simulador} -d ${PG_BASE:-simulador}
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
